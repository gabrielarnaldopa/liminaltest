name: Compilar IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compilar sin firmar (AltServer la firma con tu Apple ID)
        run: |
          xcodebuild -project Liminal.xcodeproj -target Liminal -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar Liminal.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Liminal.app Payload/
          zip -qry Liminal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Liminal-ipa
          path: Liminal.ipa
